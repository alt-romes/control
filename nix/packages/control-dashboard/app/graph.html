<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>control</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f6f4; --fg: #1d1d1b; --muted: #8a8a85; --card: #fff; --scope: #0000000a; --line: #0002; --edge: #0004;
  --bad: #d62718;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111213; --fg: #e8e8e4; --card: #1c1d1f; --scope: #ffffff08; --line: #fff2; --edge: #fff4; }
}
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font: 13px/1.35 system-ui, sans-serif; }
#area { position: fixed; inset: 0 300px 0 0; }
#machines { position: fixed; top: 0; right: 0; bottom: 0; width: 300px; box-sizing: border-box; overflow: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px;
  border-left: 1px solid var(--line); }
#machines h4 { margin: 4px 0; font-size: 11px; font-weight: 400; color: var(--muted); }
#machines .row { padding: 4px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
#machines .line { display: flex; justify-content: space-between; gap: 8px; }
#machines .line span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#machines .line.actionable, #machines .line.crisis { color: var(--bad); }
#machines .line.crisis { font-weight: 600; }
.card.selected { outline: 2px solid var(--fg); }
#machines h3 { margin: 0; font-size: 14px; word-break: break-all; }
#machines .close { float: right; margin: 0; border: 0; font-size: 16px; padding: 0 4px; background: none; }
#machines details { border-bottom: 1px solid var(--line); padding: 4px 0; font-size: 12px; }
#machines summary { cursor: pointer; }
#machines pre { white-space: pre-wrap; word-break: break-word; font-size: 11px; background: var(--scope); padding: 6px; border-radius: 6px; margin: 4px 0; }
@media (max-width: 700px) {
  #area { inset: 0 0 64px 0; }
  #machines { top: auto; left: 0; width: auto; height: 64px; flex-direction: row; border-left: 0; border-top: 1px solid var(--line); }
  #machines section { flex: 0 0 200px; overflow: auto; }
  #machines.open { height: 50vh; display: block; }
}
#empty { position: fixed; top: 50%; left: calc(50% - 150px); transform: translate(-50%, -50%); color: var(--muted); }
@media (max-width: 700px) { #empty { left: 50%; } }
#error { position: fixed; top: 8px; left: 8px; z-index: 10; color: var(--bad); font-weight: 600; }
dash-node { display: block; width: 220px; }
dash-node:has(.view) { width: 360px; }
dash-node:has(.view.people), dash-node:has(.view.runs) { width: 320px; }
.card { box-sizing: border-box; width: 100%; height: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; overflow: hidden; }
.card.scope { background: var(--scope); }
.card.group .title { font-weight: 400; color: var(--muted); }
.card.actionable { border-color: var(--bad); }
.card.crisis { border: 2px solid var(--bad); }
.title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.problem { color: var(--bad); font-size: 11px; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
button { font: inherit; margin-top: 6px; padding: 3px 9px; border-radius: 6px; border: 1px solid var(--fg); background: var(--card); color: var(--fg); cursor: pointer; }
.ticks { display: flex; gap: 2px; margin-top: 4px; height: 6px; }
.ticks i { width: 4px; background: var(--line); }
.ticks i.bad, .strip i.bad { background: var(--bad); }
.strip { display: flex; height: 4px; margin-top: 3px; background: var(--scope); }
.strip i { flex: 1; }
.strip i.ran { background: var(--line); }
.metrics { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 3px; font-size: 11px; color: var(--muted); }
.metrics svg { width: 48px; height: 12px; vertical-align: middle; margin-left: 3px; }
.metrics polyline { fill: none; stroke: var(--muted); stroke-width: 1; }
.view pre { margin: 0; max-height: 240px; overflow: auto; white-space: pre-wrap; word-break: break-word; font-size: 11px; }
.view.log pre { color: var(--muted); }
.view img, .view iframe { display: block; width: 100%; border: 0; }
.view img { height: 300px; object-fit: contain; }
.view iframe { height: 440px; background: #fff; }
.view table { width: 100%; border-collapse: collapse; font-size: 12px; }
.view th { text-align: left; font-weight: 600; padding: 6px 8px 2px 0; }
.view.records th { padding-top: 0; color: var(--muted); font-weight: 400; }
.view.records td { padding-right: 8px; }
.view.trend .metrics svg { width: 120px; height: 16px; }
.view tr:first-child th { padding-top: 0; }
.view td { padding: 1px 0; vertical-align: top; white-space: nowrap; }
.view td.note { white-space: normal; }
.view td.n { text-align: right; padding: 1px 8px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.view td.note { color: var(--muted); font-size: 11px; }
.days { display: flex; align-items: flex-end; gap: 2px; height: 16px; margin-top: 4px; }
.days i { width: 6px; background: var(--edge); }
.view .person.bad { color: var(--bad); }
.view .person { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; font-size: 12px; }
.view .person span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.view .person > span:last-child { flex: none; }
</style>
</head>
<body>
<div id="area"></div>
<aside id="machines"></aside>
<div id="error"></div>
<div id="empty" hidden>No events yet</div>
<script type="module">
import { NodeEditor, ClassicPreset, AreaPlugin, AreaExtensions, LitPlugin, Presets, AutoArrangePlugin, ScopesPlugin, ScopesPresets, getDOMSocketPosition, LitElement, html, render, nothing } from '/js/vendor.js'

const socket = new ClassicPreset.Socket('s')
// A scope's children go below its own card's content.
const headers = new Map(), pad = id => ({ top: (headers.get(id) ?? 40) + 12, left: 16, bottom: 16, right: 16 })
let g = null

async function trigger(p) {
  if (!confirm(p.label + '?')) return
  const r = await fetch(`/run/${p.run}/trigger/${p.index}`, { method: 'POST' })
  if (!r.ok) alert(await r.text())
  refresh()
}

const days = ns => {
  const hi = Math.max(...ns)
  return html`<div class="days" title=${'Per day, last 14 days: ' + ns.join(' ')}>${ns.map(n => html`<i style="height:${n ? 2 + 14 * n / hi : 1}px"></i>`)}</div>`
}

// Each recognisable kind of data a run holds is its own node.
const file = f => '/file?path=' + encodeURIComponent(f)
const VIEWS = {
  table: rows => html`<table>${rows.map(r => r.head
    ? html`<tr><th colspan="3">${r.head}</th></tr>`
    : html`<tr><td>${r.cells[0]}</td><td class="n">${r.cells[1]}</td><td class="note">${r.cells[2]}</td></tr>`)}</table>`,
  people: ps => ps.map(p => html`<div class="person ${p.madeUp ? 'bad' : ''}" title=${p.email + (p.madeUp ? ': the name is nowhere in the address, maybe a bot signing up someone else' : '')}>
    <span>${p.name ?? p.email}</span><span class="sub">${p.ago}</span></div>`),
  runs: rs => rs.map(r => html`<div class="person ${r.bad ? 'bad' : ''}" title=${r.label + (r.summary ? ' · ' + r.summary : '')}>
    <span>${r.label}${r.summary ? html` <span class="sub">${r.summary}</span>` : nothing}</span><span class="sub">${r.ago}</span></div>`),
  document: f => html`<iframe src=${file(f)} title=${f}></iframe>`,
  image: f => f.startsWith('data:') ? html`<img src=${f}>` : html`<a href=${file(f)} target="_blank"><img src=${file(f)} title=${f}></a>`,
  records: t => html`<table><tr>${t.columns.map(c => html`<th>${c}</th>`)}</tr>${t.rows.map(r => html`<tr>${r.map(x => html`<td class=${typeof x === 'number' ? 'n' : ''}>${x}</td>`)}</tr>`)}</table>`,
  trend: series => html`<div class="metrics">${Object.entries(series).map(([k, xs]) => html`<span>${k} ${fmt(xs.at(-1))}${sparkline(xs)}</span>`)}</div>`,
  mail: m => html`<div class="sub">To ${[m.to].flat().join(', ')}</div><div>${m.subject}</div>${[m.attachments ?? []].flat().map(a => html`<div class="sub">${String(a).split('/').at(-1)}</div>`)}`,
  log: t => html`<pre title="End of its log">${t}</pre>`,
  text: t => html`<pre>${t}</pre>`,
  data: v => html`<pre>${JSON.stringify(v, null, 2)}</pre>`,
}

let selected = null, runs = []
const fetchRuns = async id => (await fetch('/api/runs/' + id.split('/').map(encodeURIComponent).join('/'))).json()
async function select(id) {
  const was = selected
  selected = id
  runs = id ? await fetchRuns(id) : []
  for (const i of [was, id]) if (editor.getNode(i)) await area.update('node', i)
  side()
}
const pretty = x => x == null || (typeof x === 'object' && !Object.keys(x).length) ? nothing : html`<pre>${typeof x === 'string' ? x : JSON.stringify(x, null, 2)}</pre>`
// The side lists machines and healthchecks, or shows what was clicked.
function side() {
  document.getElementById('machines').classList.toggle('open', !!selected)
  render(selected
    ? html`<div><button class="close" @click=${() => select(null)}>×</button><h3>${selected}</h3>
        ${runs.map((r, i) => html`<details ?open=${i === 0}>
          <summary title=${new Date(r.at).toLocaleString()}>${r.ago} · ${r.took}${r.summary ? ' · ' + (r.summary.length > 80 ? r.summary.slice(0, 80) + '…' : r.summary) : ''}</summary>
          ${r.summary.length > 80 ? pretty(r.summary) : nothing}
          ${r.problems.map(p => html`<div class="problem">${p}</div>`)}${pretty(r.content)}${pretty(r.result)}
        </details>`)}
        ${runs.length ? nothing : html`<p class="sub">No runs seen.</p>`}</div>`
    : [g.slept.length ? html`<p class="sub" style="white-space:normal;margin:0" title=${g.slept.join(', ')}>The dashboard's machine slept ${g.slept.length}× in the last day; it sees nothing while asleep.</p>` : nothing,
       ...[['Machines', g.machines], ['Health', g.healthchecks]].map(([h, ds]) => ds.length ? html`<section><h4>${h}</h4>${ds.map(row)}</section>` : nothing)],
    document.getElementById('machines'))
}
const row = d => html`<div class="row" @click=${() => select(d.id)}>
  <div class="line ${d.severity}"><span>${d.title}</span><span class="sub">${d.sub ?? ''}</span></div>
  ${d.problems.map(p => html`<div class="problem" title=${p}>${p}</div>`)}
  ${Object.keys(d.series ?? {}).length ? html`<div class="metrics">${Object.entries(d.series).map(([k, xs]) => html`<span>${k} ${fmt(xs.at(-1))}${sparkline(xs)}</span>`)}</div>` : nothing}
  ${d.spark?.some(x => x !== null) ? html`<div class="strip" title="Last 24h">${d.spark.map(x => html`<i class=${x === null ? '' : x ? 'bad' : 'ran'}></i>`)}</div>` : nothing}
</div>`
const fmt = x => Number.isInteger(x) ? x : x.toFixed(1)
const sparkline = xs => {
  if (xs.length < 2) return nothing
  const lo = Math.min(...xs), hi = Math.max(...xs), y = x => hi === lo ? 6 : 11 - 10 * (x - lo) / (hi - lo)
  return html`<svg viewBox="0 0 48 12" preserveAspectRatio="none"><polyline points=${xs.map((x, i) => `${48 * i / (xs.length - 1)},${y(x)}`).join(' ')}></polyline></svg>`
}

// Only problems are coloured: a group is plain, whatever it holds.
const card = (d, scope) => d.group
  ? html`<div class="card group scope"><div class="title">${d.title}</div></div>`
  : html`<div class="card ${d.severity} ${scope ? 'scope' : ''} ${d.id === selected ? 'selected' : ''}">
      <div class="title" title=${d.id}>${d.title}</div>
      ${d.sub ? html`<div class="sub">${d.sub}</div>` : nothing}
      ${d.days ? days(d.days)
        : d.history?.length > 1 ? html`<div class="ticks" title="Latest runs">${d.history.map(b => html`<i class=${b ? 'bad' : ''}></i>`)}</div>` : nothing}
      ${(d.problems ?? []).map(p => html`<div class="problem" title=${p}>${p}</div>`)}
      ${(d.pending ?? []).map(p => html`<button @pointerdown=${e => e.stopPropagation()} @click=${() => trigger(p)}>${p.label}</button>`)}
    </div>`

// Drawn in the page, not a shadow root, so the styles above apply.
class DashNode extends LitElement {
  static properties = { data: { type: Object }, emit: { attribute: false } }
  createRenderRoot() { return this }
  render() {
    const d = this.data, sock = (side, key) => html`<rete-ref style="position:absolute;top:50%;${side === 'input' ? 'left:0' : 'right:0'}"
      .data=${{ type: 'socket', side, key, nodeId: d.id, payload: socket }} .emit=${this.emit}></rete-ref>`
    const body = d.view ? html`<div class="card view ${d.view}">${d.title ? html`<div class="sub">${d.title}</div>` : nothing}${VIEWS[d.view](d.value)}</div>` : card(d, hasChildren(d.id))
    return html`${body}${sock('input', 'in')}${sock('output', 'out')}`
  }
}
customElements.define('dash-node', DashNode)

const arrowhead = (s, e) => {
  const a = Math.atan2(e.y - s.y, e.x - s.x), p = d => `${e.x - 9 * Math.cos(a + d)},${e.y - 9 * Math.sin(a + d)}`
  return `${e.x},${e.y} ${p(0.4)} ${p(-0.4)}`
}

// Rete draws edges in a shadow root, so they bring their own styles.
// A trigger labels its link; a pending one is sent from the label.
const edge = c => ({ start, end }) => !start || !end ? nothing : html`<style>
  svg { overflow: visible; position: absolute; pointer-events: none; width: 1px; height: 1px; }
  path { fill: none; stroke-width: 1.5px; stroke: var(--edge); }
  .output path, .pending path { stroke-dasharray: 4 4; }
  .label { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font: 11px/1.3 system-ui, sans-serif;
    z-index: 1; max-width: 170px; overflow: hidden; text-overflow: ellipsis; padding: 1px 6px; color: var(--muted); background: var(--bg); }
  button.label { color: var(--fg); background: var(--card); border: 1px solid var(--fg); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  polygon { fill: var(--edge); }
</style><svg class=${c.kind}><path d="M ${start.x} ${start.y} L ${end.x} ${end.y}"></path><polygon points=${arrowhead(start, end)}></polygon></svg>
${c.label == null ? nothing : c.kind === 'pending'
  ? html`<button class="label" style="left:${(start.x + end.x) / 2}px;top:${(start.y + end.y) / 2}px"
      @pointerdown=${e => e.stopPropagation()} @click=${() => trigger(c)} title=${c.label}>${c.label}</button>`
  : html`<div class="label" style="left:${(start.x + end.x) / 2}px;top:${(start.y + end.y) / 2}px" title=${c.label}>${c.label}</div>`}`

const editor = new NodeEditor(), area = new AreaPlugin(document.getElementById('area'))
const lit = new LitPlugin(), arrange = new AutoArrangePlugin(), scopes = new ScopesPlugin({ padding: pad })
lit.addPreset(Presets.classic.setup({
  socketPositionWatcher: getDOMSocketPosition(),
  customize: {
    node: ctx => ({ emit }) => html`<dash-node .data=${ctx.payload} .emit=${emit}></dash-node>`,
    socket: () => () => html`<span></span>`,
    connection: ctx => edge(ctx.payload),
  }
}))
const hasChildren = id => editor.getNodes().some(n => n.parent === id)
// Each scope lays out its own children, so each needs the spacing; a wide gap
// between layers leaves room for links' labels.
const SPACING = { 'elk.spacing.nodeNode': '30', 'elk.spacing.componentComponent': '40', 'elk.layered.spacing.nodeNodeBetweenLayers': '200' }
arrange.addPreset(() => ({
  port: ({ side, width, height }) => ({ x: side === 'output' ? width : 0, y: height / 2, width: 0, height: 0, side: side === 'output' ? 'EAST' : 'WEST' }),
  options: id => {
    if (!hasChildren(id)) return {}
    const p = pad(id)
    return { ...SPACING, 'elk.padding': `[top=${p.top},left=${p.left},bottom=${p.bottom},right=${p.right}]` }
  },
}))
scopes.addPreset(ScopesPresets.classic.setup())
editor.use(area)
area.use(lit)
area.use(arrange)
area.use(scopes)
area.addPipe(ctx => {
  const n = ctx.type === 'nodepicked' && editor.getNode(ctx.data.id)
  if (n && !n.group && !n.view) select(n.id)
  return ctx
})

const depth = (d, byId) => d.parent && byId.has(d.parent) ? 1 + depth(byId.get(d.parent), byId) : 0
let shape = ''
async function sync() {
  const nodes = new Map(g.nodes.map(d => [d.id, d])), edges = new Map(g.edges.map(e => [e.source + '>' + e.target, e]))
  for (const c of editor.getConnections()) if (!edges.has(c.id)) await editor.removeConnection(c.id)
  for (const n of [...editor.getNodes()].sort((a, b) => depth(b, nodes) - depth(a, nodes))) if (!nodes.has(n.id)) await editor.removeNode(n.id)
  // Parents first, so they're drawn beneath their children.
  for (const d of [...nodes.values()].sort((a, b) => depth(a, nodes) - depth(b, nodes))) {
    const n = editor.getNode(d.id)
    if (n) { Object.assign(n, d); await area.update('node', d.id); continue }
    const node = Object.assign(new ClassicPreset.Node(d.id), d)
    node.addInput('in', new ClassicPreset.Input(socket))
    node.addOutput('out', new ClassicPreset.Output(socket))
    await editor.addNode(node)
  }
  for (const [id, e] of edges) {
    const c = editor.getConnections().find(c => c.id === id)
    if (c) { Object.assign(c, e); await area.update('connection', id) }
    else await editor.addConnection({ id, sourceOutput: 'out', targetInput: 'in', ...e })
  }

  const s = JSON.stringify([g.nodes.map(d => [d.id, d.parent, d.problems?.length, d.pending?.length, d.history?.length > 1, d.view, ['people', 'runs'].includes(d.view) ? d.value.length : 0]), [...edges.keys()]])
  if (s === shape) return
  const first = !shape
  shape = s
  // Leaves keep their natural size; ELK sizes the scopes around them.
  for (const n of editor.getNodes()) {
    const el = area.nodeViews.get(n.id).element.querySelector('dash-node')
    el.style.width = el.style.height = ''
    if (hasChildren(n.id)) headers.set(n.id, el.offsetHeight)
    else ({ offsetWidth: n.width, offsetHeight: n.height } = el)
  }
  await arrange.layout({ options: { 'elk.direction': 'RIGHT', 'elk.aspectRatio': String(innerWidth / innerHeight), ...SPACING } })
  if (first) await AreaExtensions.zoomAt(area, editor.getNodes())
}

let busy = false
async function refresh() {
  if (busy) return
  busy = true
  try {
    g = await (await fetch('/api/graph')).json()
    for (const d of g.nodes) d.parent ??= undefined // the arrange plugin only takes undefined as top-level
    await sync()
    if (selected) runs = await fetchRuns(selected)
    side()
    document.getElementById('empty').hidden = g.nodes.length > 0
    // Subtasks' problems are their run's too.
    const bad = [...g.machines, ...g.healthchecks, ...g.nodes].filter(d => !d.group && d.severity && d.severity !== 'healthy' && !(d.parent && !d.parent.endsWith('/'))).length
    document.title = (bad ? `(${bad}) ` : '') + 'control'
    document.getElementById('error').textContent = g.connected ? '' : 'Broker unreachable: this may be stale'
  } catch (e) {
    document.getElementById('error').textContent = 'Dashboard unreachable: ' + e.message
  } finally { busy = false }
}
await refresh()
setInterval(refresh, 5000)
</script>
</body>
</html>
