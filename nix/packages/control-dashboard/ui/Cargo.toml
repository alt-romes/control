[package]
name = "control-dashboard"
version = "0.3.0"
edition = "2024"

[[bin]]
name = "control-dashboard"
path = "src/main.rs"

[dependencies]
dear-imgui-rs = "0.22"
dear-imnodes = "0.22"
ewebsock = "0.8"
ehttp = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dear-app = { version = "0.22", features = ["imnodes"] }
