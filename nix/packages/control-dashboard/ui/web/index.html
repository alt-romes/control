<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Control</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1a1a1f; overflow: hidden; }
      #canvas { display: block; width: 100vw; height: 100vh; }
    </style>
    <script type="importmap">{ "imports": { "imgui-sys-v1": "./imgui-sys-v1-wrapper.js" } }</script>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <script>
      // One memory for both Dear ImGui (imgui-sys-v1) and the dashboard.
      globalThis.__imgui_shared_memory = new WebAssembly.Memory({ initial: 2048, maximum: 4096 });
    </script>
    <script type="module">
      import init from './control-dashboard.js';
      init().catch(e => {
        // winit throws to leave its setup; that's not a failure.
        if (!String(e && (e.message || e)).includes("Using exceptions for control flow")) console.error(e);
      });
    </script>
  </body>
</html>
